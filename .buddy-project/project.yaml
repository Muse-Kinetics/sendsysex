name: SendSysEx CLI
description: >-
  Cross-platform C++11 command-line utility for sending MIDI SysEx and running
  family-aware two-step bootloader firmware updates on KMI/Muse Kinetics
  hardware. Device knowledge lives in data/families/*.json; MIT-licensed public
  repo. Uses the Muse-Kinetics RtMidi fork (inc/rtmidi submodule, branch
  sysex-send-flowcontrol).
